<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" role="img" aria-labelledby="title desc">
<title id="title">From Gates to GEMM — chip architecture</title>
<desc id="desc">A 16-bit CPU containing scalar and eight-lane SIMD execution dispatches an independent eight-lane SIMT GPU. Both access shared 1024-word RAM. The GPU reports its state to the CPU. A program load port writes directly to RAM.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#526278" stroke-width="1.6"/></marker></defs>
